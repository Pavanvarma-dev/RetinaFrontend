name: Test Workflow

on:
  push: 
 
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: download code into server
        uses: actions/checkout@v3

      - name: setting up nodejs
        uses: actions/setup-node@v4
        with:
          version: 22
      - name: installing dependies
        run: npm ci
      - name: running test
        continue-on-error: true
        id: run-test
        run : npm test
      - name: upload test
        # if: failure() && steps.run-test.outcome == 'failure'''
        uses: actions/upload-artifact@v4
        with:
          name: test files
          path: test.json
  build:

    strategy:
      matrix:
        node-version: [18,19,20]
        os: [ubuntu-latest,windows-latest]
    needs: test
    runs-on: ${{matrix.os}}

    steps:
      - name: download code into server
        uses: actions/checkout@v3

      - name: setting up nodejs
        uses: actions/setup-node@v4
        with:
          version: ${{matrix.node-version}}
      - name: installing dependies
        run: npm ci
      - name: building the app
        run : npm run build
  deploy:
    needs: build
    
    runs-on: ubuntu-latest

    steps:
      - name: download code into server
        uses: actions/checkout@v3

      - name: setting up nodejs
        uses: actions/setup-node@v4
        with:
          version: 22
      - name: deploying into server
        run: |
          echo "It is done"
          echo "It is  not done"
  excess:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: output informations
        run: echo "It's working rey"

